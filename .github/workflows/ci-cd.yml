name: NexusHub Lite - CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write  # Diperlukan untuk push Docker image ke GitHub Container Registry (ghcr.io)

jobs:
  # ====================================================================
  # JOB 1: BUILD, TYPECHECK & LINT (Continuous Integration)
  # ====================================================================
  build-and-lint:
    name: 🏗️ Build & Typecheck (All Services)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build All Packages & Apps (SDK, Backend, Frontend, MES, Agent)
        run: npm run build

      - name: Run Full TypeScript Typecheck
        run: npm run typecheck

  # ====================================================================
  # JOB 2: DEVSECOPS SECURITY GATES (Shift-Left Security)
  # ====================================================================
  security-scan:
    name: 🛡️ Security Gate (Secrets & CVEs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Pindai Kredensial / Secret bocor
      - name: Secret Scanning (GitLeaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Pindai Kerentanan Dependency (SCA)
      - name: Dependency Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ====================================================================
  # JOB 3: INTEGRATION SMOKE TEST (Docker Compose di Runner)
  # ====================================================================
  integration-test:
    name: 🧪 Ephemeral Infrastructure Smoke Test
    needs: [build-and-lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Nyalakan kontainer inti (PostgreSQL, Kafka, DragonFly, ClickHouse)
      - name: Spin Up Infrastructure Containers
        run: |
          docker compose up -d postgres dragonfly kafka clickhouse
          sleep 12
          docker compose ps

      - name: Verify Service Readiness
        run: |
          docker compose exec -T postgres pg_isready -U postgres
          curl -s -f http://localhost:8123/ping || exit 1
          docker compose exec -T dragonfly redis-cli ping || exit 1

      - name: Tear Down Ephemeral Stack
        if: always()
        run: docker compose down -v

  # ====================================================================
  # JOB 4: CONTINUOUS DELIVERY (Build & Push Container Images)
  # Hanya aktif saat push ke branch main / master (Bukan saat Pull Request)
  # ====================================================================
  build-and-push-images:
    name: 🚀 Build & Push Docker Image
    needs: [build-and-lint, security-scan, integration-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: portal-backend
            context: .
            dockerfile: apps/portal-backend/Dockerfile
          - service: portal-frontend
            context: .
            dockerfile: apps/portal-frontend/Dockerfile
          - service: mes-engine
            context: .
            dockerfile: apps/mes-engine/Dockerfile
          - service: client-agent
            context: .
            dockerfile: apps/client-agent/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

