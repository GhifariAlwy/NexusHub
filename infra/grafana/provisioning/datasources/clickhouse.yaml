apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: clickhouse:9000
    isDefault: true
    jsonData:
      port: 9000
      server: clickhouse
      username: default
      tlsSkipVerify: true
      defaultDatabase: observability_db
    editable: true

