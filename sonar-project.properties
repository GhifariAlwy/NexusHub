# ====================================================================
# NexusHub Lite: SonarQube Scanner Configuration (SAST & Code Quality)
# Project : NexusHub Lite (projectKey: nexushub-lite)
# Server  : http://localhost:9000 (sonarqube community, profile opsional)
# Jalankan: npm run sonar
# ====================================================================

sonar.projectKey=nexushub-lite
sonar.projectName=NexusHub Lite
sonar.projectVersion=1.0.0
# Sumber daya teks: UTF-8 (YAML/JSON/TS)
sonar.sourceEncoding=UTF-8

# --------------------------------------------------------------------
# EXCLUSIONS GLOBAL (artefak build, bundler, dependency, coverage)
# Bisa ditambahkan pattern per-module di bawah masing-masing module.
# --------------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**, \
  **/dist/**, \
  **/build/**, \
  **/coverage/**, \
  **/*.min.js, \
  **/*.min.css, \
  **/vite.config.ts, \
  **/vite.config.js, \
  **/webpack.config.js, \
  **/rollup.config.js, \
  **/esbuild.config.js, \
  **/tsconfig.json, \
  **/tsconfig.node.json

# --------------------------------------------------------------------
# MULTI-MODULE: Satu module per workspace monorepo (npm workspaces).
# Hanya workspace dengan production source code yang discan.
# --------------------------------------------------------------------
sonar.modules=portal-backend,portal-frontend,client-agent,mes-engine,client-sdk

# ---------- apps/portal-backend (Node/Express API) ----------
portal-backend.sonar.projectBaseDir=apps/portal-backend
portal-backend.sonar.sources=src
# Workspace ini belum memiliki tsconfig.json dedicated (plain TS, di-resolve
# runtime). SonarJS >= v10 menganalisis TS tanpa tsconfig (type-less analysis).

# ---------- apps/portal-frontend (React + Vite SPA) ----------
portal-frontend.sonar.projectBaseDir=apps/portal-frontend
portal-frontend.sonar.sources=src
# tsconfigPaths relatif terhadap module baseDir (konvensi multi-module scanner)
portal-frontend.sonar.typescript.tsconfigPaths=tsconfig.json

# ---------- apps/client-agent (Runtime lokal tenant) ----------
client-agent.sonar.projectBaseDir=apps/client-agent
client-agent.sonar.sources=src
client-agent.sonar.exclusions=**/*.d.ts

# ---------- apps/mes-engine (Kafka routing engine) ----------
mes-engine.sonar.projectBaseDir=apps/mes-engine
mes-engine.sonar.sources=src

# ---------- packages/client-sdk (Shared library) ----------
client-sdk.sonar.projectBaseDir=packages/client-sdk
client-sdk.sonar.sources=src
client-sdk.sonar.typescript.tsconfigPaths=tsconfig.json
client-sdk.sonar.exclusions=**/*.d.ts
